<meta property="og:title" content="Eikóna · Sites, fotografia e Instagram para empresas de SP">
<meta property="og:description" content="Cases, apresentação por segmento e diagnóstico digital gratuito.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
/* Layout: cabeçalho claro com a lente; cada vista (início, segmento, diagnóstico) em faixas alternadas de mármore e marrom-escuro, cases em quadro de navegador + celular. Peça da marca: tema único, claro. */
:root {
  --marmore: #F3EFE9; --marmore-claro: #FBF9F6; --areia: #E8E0D5; --veio: #D8CFC4;
  --tinta: #2A1D16; --tinta-suave: #6A5A4D; --terra: #6E4530; --terra-escura: #2A1D16;
  --sobre-escuro: #F3EFE9; --sobre-escuro-suave: #C9BCAF; --egeu: #1F5C8F; --egeu-claro: #7FB3DF; --egeu-suave: #E1EBF4;
  --alerta: #9A3520; --alerta-suave: #F4DFD6;
  --fonte: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--marmore); color: var(--tinta); font: 16px/1.6 var(--fonte); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--marmore-claro); }
a { color: var(--egeu); }
:focus-visible { outline: 2px solid var(--egeu); outline-offset: 2px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.in { max-width: 1160px; margin: 0 auto; }
.rot { font-size: 12px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--tinta-suave); }
h1, h2, h3 { font-weight: 700; letter-spacing: -.04em; line-height: 1.02; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(40px, 7vw, 76px); }
h2 { font-size: clamp(30px, 4.4vw, 48px); }
h3 { font-size: 24px; letter-spacing: -.025em; line-height: 1.15; }
h1 i, h2 i, h3 i { font-style: normal; color: var(--egeu); }
.escuro h1 i, .escuro h2 i, .escuro h3 i { color: var(--egeu-claro); }
p { margin: 0; }
.lead { font-size: 19px; line-height: 1.55; color: var(--tinta-suave); max-width: 60ch; }

/* cabeçalho */
.cab { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--marmore-claro); border-bottom: 1px solid var(--veio); }
.cab .in { display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; padding-block: 12px; }
.marca { display: flex; align-items: center; gap: 10px; color: var(--tinta); text-decoration: none; }
.lente { width: 32px; height: 32px; flex: none; }
.marca b { font-size: 23px; letter-spacing: -.045em; line-height: 1; }
.marca b i { font-style: normal; color: var(--egeu); }
.marca small { display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--terra); font-weight: 500; margin-top: 2px; }
.nav { display: flex; gap: 2px 4px; flex-wrap: wrap; margin-left: auto; }
.nav a { color: var(--tinta-suave); text-decoration: none; font-weight: 500; font-size: 14px; padding: 6px 10px; border-radius: 4px; }
.nav a:hover { background: var(--areia); color: var(--tinta); }
.nav a[aria-current="page"] { background: var(--terra); color: var(--marmore-claro); }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 4px; padding: 12px 18px; font-weight: 500; text-decoration: none; border: 1px solid transparent; font-size: 15px; }
.btn.pri { background: var(--terra); color: var(--marmore-claro); }
.btn.pri:hover { filter: brightness(1.1); }
.btn.sec { border-color: var(--veio); color: var(--tinta); background: var(--marmore-claro); }
.escuro .btn.sec { border-color: #5a473b; color: var(--sobre-escuro); background: transparent; }

/* faixas */
.faixa { padding-block: clamp(48px, 8vw, 96px); position: relative; overflow: hidden; }
.escuro { background: var(--terra-escura); color: var(--sobre-escuro); }
.escuro .rot, .escuro .lead, .escuro .suave { color: var(--sobre-escuro-suave); }
.areia { background: var(--areia); }
.marca-agua { position: absolute; width: min(70vw, 760px); right: -14%; top: -18%; opacity: .07; pointer-events: none; color: var(--tinta); }
.escuro .marca-agua { color: var(--sobre-escuro); opacity: .06; }
.hero .in { display: grid; gap: 22px; position: relative; }
.hero .acoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.cab-sec { display: grid; gap: 12px; margin-bottom: 36px; max-width: 760px; }

/* segmentos */
.segs { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0; border-top: 1px solid var(--veio); }
.seg { padding: 22px 22px 22px 0; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit; border-bottom: 1px solid var(--veio); }
.seg + .seg { padding-left: 22px; border-left: 1px solid var(--veio); }
.seg:hover h3 { color: var(--terra); }
.seg p { color: var(--tinta-suave); font-size: 15px; }
.seg span.ir { margin-top: auto; color: var(--egeu); font-weight: 500; font-size: 14px; }
@media (max-width: 560px) { .seg + .seg { border-left: 0; padding-left: 0; } }

/* cases */
.cases { display: grid; gap: clamp(40px, 6vw, 72px); }
.case { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); align-items: center; }
.case:nth-child(even) .mock { order: 2; }
@media (max-width: 820px) { .case { grid-template-columns: minmax(0, 1fr); } .case:nth-child(even) .mock { order: 0; } }
.case-txt { display: grid; gap: 12px; }
.case-txt p { color: var(--sobre-escuro-suave); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; border: 1px solid #5a473b; color: var(--sobre-escuro); }
.claro .chip { border-color: var(--veio); color: var(--tinta-suave); }
.mock { position: relative; padding: 0 48px 28px 0; }
.navegador { background: #FBF9F6; border-radius: 4px; overflow: hidden; box-shadow: 0 20px 48px #00000059; }
.navegador .barra { display: flex; gap: 6px; padding: 9px 12px; background: #E8E0D5; }
.navegador .barra i { width: 10px; height: 10px; border-radius: 50%; background: #C9BCAF; }
.navegador img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; }
.celular { position: absolute; right: 0; bottom: 0; width: 26%; min-width: 96px; border: 6px solid #120c09; border-radius: 22px; overflow: hidden; background: #120c09; box-shadow: 0 14px 32px #00000066; }
.celular img { display: block; width: 100%; aspect-ratio: 9 / 18.5; object-fit: cover; object-position: top; }

/* agenda (demonstração) */
.agenda-box { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: clamp(24px, 5vw, 64px); align-items: center; }
@media (max-width: 760px) { .agenda-box { grid-template-columns: minmax(0, 1fr); } }
.fone { width: min(100%, 330px); margin: 0 auto; border: 9px solid var(--tinta); border-radius: 34px; background: #FFFFFF; overflow: hidden; box-shadow: 0 24px 50px #2a1d1640; color: #1E1C19; font-size: 13px; }
.fone .topo { background: var(--terra); color: #FBF9F6; padding: 22px 18px 16px; display: grid; gap: 2px; }
.fone .topo b { font-size: 20px; letter-spacing: -.02em; line-height: 1.15; overflow-wrap: anywhere; }
.fone .topo span { font-size: 12px; opacity: .85; }
.fone .corpo { padding: 14px; display: grid; gap: 12px; }
.fone .eti { font-size: 10px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: #69635B; }
.fone .sv { display: flex; justify-content: space-between; gap: 10px; border: 1px solid #E0DBD2; border-radius: 10px; padding: 9px 11px; }
.fone .sv.on { border-color: var(--terra); background: #F6EEE7; }
.fone .sv b { font-weight: 500; }
.fone .sv span { color: #69635B; white-space: nowrap; }
.fone .dias, .fone .horas { display: flex; gap: 6px; flex-wrap: wrap; }
.fone .dia { border: 1px solid #E0DBD2; border-radius: 9px; padding: 5px 0; width: 46px; text-align: center; line-height: 1.2; font-size: 11px; color: #69635B; }
.fone .dia b { display: block; font-size: 16px; color: #1E1C19; }
.fone .dia.on { background: var(--terra); border-color: var(--terra); color: #FBF9F6; }
.fone .dia.on b { color: #FBF9F6; }
.fone .hora { border: 1px solid #E0DBD2; border-radius: 999px; padding: 4px 11px; font-weight: 500; }
.fone .hora.on { background: var(--terra); color: #FBF9F6; border-color: var(--terra); }
.fone .ok { background: var(--terra); color: #FBF9F6; border-radius: 999px; text-align: center; padding: 10px; font-weight: 500; }
.lista-v { display: grid; gap: 14px; padding: 0; margin: 18px 0 0; list-style: none; }
.lista-v li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; }
.lista-v li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--egeu); margin-top: 8px; }

/* processo */
.passos { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 24px; counter-reset: p; }
.passo { display: grid; gap: 6px; border-top: 2px solid var(--tinta); padding-top: 14px; }
.passo .n { font-size: 12px; font-weight: 500; letter-spacing: .16em; color: var(--terra); }
.passo p { color: var(--tinta-suave); font-size: 15px; }

/* diagnóstico */
.achados { display: grid; gap: 0; border-top: 1px solid var(--veio); }
.achado { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; padding: 20px 0; border-bottom: 1px solid var(--veio); }
.achado .ico { width: 36px; height: 36px; border-radius: 50%; background: var(--alerta-suave); color: var(--alerta); display: grid; place-items: center; font-weight: 700; }
.achado.leve .ico { background: var(--egeu-suave); color: var(--egeu); }
.achado h3 { font-size: 21px; margin-bottom: 6px; }
.achado p { color: var(--tinta-suave); overflow-wrap: anywhere; }
.solucoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 8px; }
.sol { background: var(--marmore-claro); border: 1px solid var(--veio); border-radius: 4px; padding: 18px; display: grid; gap: 6px; }
.sol p { color: var(--tinta-suave); font-size: 15px; }
.nota { font-size: 13px; color: var(--tinta-suave); }
.cta { display: grid; gap: 18px; max-width: 720px; }
.contato { font-size: 14px; color: var(--sobre-escuro-suave); }
.rodape { padding-block: 28px; font-size: 13px; color: var(--tinta-suave); border-top: 1px solid var(--veio); }
.rodape .in { display: flex; gap: 8px 20px; flex-wrap: wrap; justify-content: space-between; }
.concs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 22px; }
.conc { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; }
.conc img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px; margin-bottom: 8px; transition: transform .3s; }
.conc:hover img { transform: translateY(-3px); }
.conc p { color: var(--tinta-suave); font-size: 15px; }
.conc .ir { color: var(--egeu); font-weight: 500; font-size: 14px; }
.conc-img img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px; box-shadow: 0 20px 44px #2a1d1633; }
/* ===== redesenho ===== */
.cab .in { flex-wrap: nowrap; }
.nav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { white-space: nowrap; }
.nav a.cta-nav { background: var(--terra); color: var(--marmore-claro); margin-left: 6px; }
.nav a.cta-nav:hover { background: var(--terra); filter: brightness(1.1); color: var(--marmore-claro); }
@media (max-width: 760px) { .cab .in { flex-wrap: wrap; } .nav { margin-left: 0; width: 100%; } .marca small { display: none; } .nav a.cta-nav { order: -1; margin: 0 6px 0 0; } }
.conc.chamar { background: var(--terra-escura); color: var(--sobre-escuro); border-radius: 4px; padding: 24px; justify-content: flex-end; min-height: 260px; }
.conc.chamar p { color: var(--sobre-escuro-suave); }
.conc.chamar .ir { color: var(--egeu-claro); }
.btn.claro { background: var(--marmore-claro); color: var(--tinta); }
.btn.linha-clara { border-color: rgba(255,255,255,.55); color: #fff; }

/* abertura da página inicial */
.abre { padding-block: clamp(40px, 6vw, 72px) clamp(56px, 8vw, 96px); position: relative; overflow: hidden; }
.abre .in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: clamp(28px, 5vw, 64px); align-items: center; }
@media (max-width: 900px) { .abre .in { grid-template-columns: minmax(0, 1fr); } }
.abre-txt { display: grid; gap: 22px; }
.abre-txt h1 { font-size: clamp(44px, 6.4vw, 80px); }
.abre .acoes { display: flex; gap: 10px; flex-wrap: wrap; }
.prova { display: flex; gap: 8px 18px; flex-wrap: wrap; font-size: 14px; color: var(--tinta-suave); }
.prova span { display: inline-flex; align-items: center; gap: 8px; }
.prova span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--egeu); }
.colagem { position: relative; display: grid; grid-template-columns: 1.1fr .9fr 1fr; grid-template-rows: 190px 190px 150px; gap: 10px; }
.colagem > img { width: 100%; height: 100%; object-fit: cover; display: block; }
.colagem .c1 { grid-column: 1; grid-row: 1 / 3; }
.colagem .c2 { grid-column: 2; grid-row: 1; }
.colagem .c3 { grid-column: 3; grid-row: 1 / 2; }
.colagem .c4 { grid-column: 2 / 4; grid-row: 2; }
.colagem .c5 { grid-column: 1 / 2; grid-row: 3; }
.colagem .c6 { grid-column: 2 / 4; grid-row: 3; }
.colagem .tela { position: absolute; left: 8%; bottom: -34px; width: 62%; background: #FBF9F6; border-radius: 4px; overflow: hidden; box-shadow: 0 24px 60px #2a1d1659; }
.colagem .tela .barra { display: flex; gap: 6px; padding: 7px 10px; background: #E8E0D5; }
.colagem .tela .barra i { width: 8px; height: 8px; border-radius: 50%; background: #C9BCAF; }
.colagem .tela img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; }
.colagem .cel { position: absolute; right: -10px; bottom: -48px; width: 23%; min-width: 92px; border: 6px solid #120c09; border-radius: 22px; overflow: hidden; background: #120c09; box-shadow: 0 18px 40px #00000066; }
.colagem .cel img { display: block; width: 100%; aspect-ratio: 9 / 19; object-fit: cover; object-position: top; }
@media (max-width: 560px) { .colagem { grid-template-rows: 130px 130px 100px; } .colagem .tela { width: 72%; left: 4%; } .colagem .cel { right: 0; } }
.fita { background: var(--terra-escura); color: var(--sobre-escuro-suave); padding-block: 16px; font-size: 14px; font-weight: 500; letter-spacing: .04em; }
.fita .in { display: flex; flex-wrap: wrap; gap: 6px 22px; justify-content: center; }
.fita span::after { content: "·"; margin-left: 22px; color: var(--egeu-claro); }
.fita span:last-child::after { content: ""; }

/* serviços */
.servs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 28px 22px; }
.serv { display: flex; flex-direction: column; gap: 10px; }
.serv .ft { aspect-ratio: 4 / 3; overflow: hidden; border-radius: 4px; background: var(--areia); }
.serv .ft img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s; }
.serv:hover .ft img { transform: scale(1.04); }
.serv .n { font-size: 12px; font-weight: 500; letter-spacing: .16em; color: var(--terra); }
.serv p { color: var(--tinta-suave); font-size: 15px; }

/* segmentos com foto */
.segs-f { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 14px; }
.seg-f { position: relative; aspect-ratio: 3 / 4; overflow: hidden; border-radius: 4px; color: #fff; text-decoration: none; display: flex; flex-direction: column; justify-content: flex-end; padding: 22px; }
.seg-f img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
.seg-f::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,12,8,.15) 0%, rgba(20,12,8,.55) 40%, rgba(20,12,8,.92) 100%); }
.seg-f > * { position: relative; z-index: 1; }
.seg-f:hover img { transform: scale(1.05); }
.seg-f .rot { color: #E8DCCF; }
.seg-f h3 { font-size: 23px; margin: 6px 0 8px; }
.seg-f p { font-size: 14px; color: #E8DCCF; }
.seg-f .ir { margin-top: 12px; font-weight: 500; font-size: 14px; color: #fff; }

/* filtro dos projetos */
.filtro { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 26px; }
.filtro button { border: 1px solid var(--veio); background: var(--marmore-claro); color: var(--tinta); border-radius: 999px; padding: 8px 15px; font: 500 14px var(--fonte); cursor: pointer; }
.filtro button[aria-pressed="true"] { background: var(--tinta); color: var(--marmore); border-color: var(--tinta); }

/* abertura com foto (segmentos e diagnóstico) */
.abre-f { position: relative; color: #fff; min-height: min(78vh, 660px); display: flex; align-items: flex-end; overflow: hidden; }
.abre-f > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.abre-f::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20,12,8,.88) 0%, rgba(20,12,8,.6) 45%, rgba(20,12,8,.15) 100%); }
.abre-f .in { position: relative; z-index: 1; width: 100%; padding-block: 120px 64px; display: grid; gap: 20px; }
.abre-f .in > * { max-width: 680px; }
.abre-f .rot { color: #E8DCCF; }
.abre-f h1 i { color: var(--egeu-claro); }
.abre-f .lead { color: #EDE4DA; }
.abre-f .acoes { display: flex; gap: 10px; flex-wrap: wrap; }
.dividido { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 64px); align-items: center; }
.dividido > img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 4px; }
@media (max-width: 820px) { .dividido { grid-template-columns: minmax(0, 1fr); } .dividido > img { aspect-ratio: 4 / 3; } }

/* diagnóstico grátis */
.pedido { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 64px); align-items: start; }
@media (max-width: 820px) { .pedido { grid-template-columns: minmax(0, 1fr); } }
.form-d { background: var(--marmore-claro); border: 1px solid var(--veio); border-radius: 4px; padding: clamp(20px, 3vw, 32px); display: grid; gap: 14px; color: var(--tinta); }
.form-d label { display: grid; gap: 6px; font-size: 14px; font-weight: 500; }
.form-d input, .form-d select { font: 15px var(--fonte); padding: 11px 12px; border: 1px solid var(--veio); border-radius: 4px; background: #fff; color: var(--tinta); width: 100%; }
.form-d .dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .form-d .dupla { grid-template-columns: 1fr; } }
.recebe { list-style: none; padding: 0; margin: 22px 0 0; display: grid; gap: 14px; }
.recebe li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; }
.recebe li b { display: block; }
.recebe li span { color: var(--sobre-escuro-suave); font-size: 15px; }
.recebe li::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--egeu-claro); margin-top: 6px; }

/* perguntas */
.faq { max-width: 820px; }
.faq details { border-top: 1px solid var(--veio); padding: 18px 0; }
.faq details:last-child { border-bottom: 1px solid var(--veio); }

        <ul class="recebe"><li><div><b>Como você aparece no Google</b><span>Se o site abre, se funciona no celular, se o perfil da empresa está completo.</span></div></li>
          <li><div><b>O que o Instagram está passando</b><span>Frequência, padrão visual e se o caminho até o WhatsApp está claro.</span></div></li>
          <li><div><b>O que resolver primeiro</b><span>Uma lista curta, em ordem de impacto, sem compromisso.</span></div></li></ul></div>
      <form class="form-d" id="formDiag" novalidate><label for="dEmp">Nome da empresa<input id="dEmp" required placeholder="Como aparece no Google"></label>
        <label for="dLink">Instagram ou site<input id="dLink" placeholder="@perfil ou www.site.com.br"></label>
        <div class="dupla"><label for="dSeg">Segmento<select id="dSeg"><option>Salão, barbearia ou estética</option><option>Saúde ou academia</option><option>Restaurante, padaria ou mercado</option><option>Loja ou prestador de serviço</option><option>Indústria ou B2B</option><option>Outro</option></select></label>
          <label for="dBairro">Bairro<input id="dBairro" placeholder="Ex.: Tatuapé"></label></div>
        <button class="btn pri" type="submit" style="justify-content:center">Pedir diagnóstico pelo WhatsApp</button><p class="nota">A resposta chega no seu WhatsApp em até um dia útil.</p></form></div></section>
    ${secProcesso()}
    <section class="faixa areia gut" id="faq"><div class="in"><div class="cab-sec"><span class="rot">Dúvidas</span><h2>Perguntas frequentes<i>.</i></h2></div>
      <div class="faq">${FAQ.map(([q, r]) => `<details><summary>${esc(q)}</summary><p>${esc(r)}</p></details>`).join("")}</div></div></section>
    <section class="faixa final gut"><img src="conceito/navalha-mooca/img/p1.jpg" alt="" loading="lazy"><div class="in cta"><h2>Vamos ver o que dá para melhorar no seu negócio<i>.</i></h2><p class="lead">Chama no WhatsApp: a primeira conversa é para entender o seu caso, sem compromisso.</p>
      <div><a class="btn claro" href="${esc(W)}" target="_blank" rel="noopener">Conversar pelo WhatsApp</a></div><p class="contato">Guilherme Gomes da Silva · (11) 98370-1215 · g.gomes1353@gmail.com · @eikona.mkt</p></div></section>`;
}
function vSeg(k) {
  const s = SEG[k];
  return `${abreFoto(FOTO_SEG[k], s.nome, esc(s.titulo), esc(s.lead), `<a class="btn claro" href="${esc(wa(`Oi! Vi a apresentação da Eikóna para ${s.nome.toLowerCase()} e quero conversar.`))}" target="_blank" rel="noopener">Conversar pelo WhatsApp</a><a class="btn linha-clara" href="#exemplos-${k}" data-rolar="exemplos-${k}">Ver sites de exemplo</a>`)}
    <section class="faixa areia gut"><div class="in dividido"><div><div class="cab-sec"><span class="rot">O que costuma travar</span><h2>Onde os clientes se perdem hoje<i>.</i></h2></div>
      <ul class="lista-v">${s.dores.map(d => `<li><span>${esc(d)}</span></li>`).join("")}</ul></div><img src="${FOTO_DOR[k]}" alt="" loading="lazy"></div></section>
    ${s.agenda ? `<section class="faixa gut"><div class="in agenda-box"><div class="cab-sec" style="margin:0"><span class="rot">Agenda online</span><h2>A cliente marca sozinha, a qualquer hora<i>.</i></h2>
      <p class="lead">Ela escolhe o serviço, o dia e o horário, paga o sinal por Pix e recebe a confirmação e o lembrete no WhatsApp. Você só acompanha.</p>
      <div><a class="btn sec" href="agenda/" target="_blank" rel="noopener">Testar a demonstração</a></div></div>${agenda(k === "saude" ? "Sua clínica" : "Seu estúdio", k === "saude" ? "clínica" : "esmalteria")}</div></section>` : ""}
    <section class="faixa gut ${s.agenda ? "areia" : ""}"><div class="in"><div class="cab-sec"><span class="rot">O que entregamos</span><h2>Do primeiro clique ao cliente na porta<i>.</i></h2></div>
      <div class="solucoes">${s.entregas.map(e => `<div class="sol"><h3>${esc(e[0])}</h3><p>${esc(e[1])}</p></div>`).join("")}</div></div></section>
    <div id="exemplos-${k}">${secConc(CONC.filter(c => c[3] === k), "Sites de exemplo para " + s.nome.toLowerCase(), "Empresas fictícias, sites de verdade. Teste a agenda, o cardápio ou o pedido como se fosse um cliente.")}</div>${secCases(s.cases, "Trabalhos que mostram como fazemos")}${secProcesso()}${secCTA("Vamos ver o que dá para melhorar no seu", `Oi! Vi a apresentação da Eikóna para ${s.nome.toLowerCase()} e quero conversar.`)}`;
}
function achados(p) {
  const A = [], tipo = (p.t || "").toLowerCase(), b = p.d;
  const host = u => { try { return new URL(/^https?:/.test(u) ? u : "http://" + u).hostname.replace(/^www\./, ""); } catch { return "o site"; } };
  if (p.g.includes("site_fora")) A.push(["!", "O site não abre", `Ao abrir ${host(p.w)}, ${p.wy}. Quem chega pelo Google ou por um link antigo encontra uma página de erro e procura outra opção.`]);
  if (p.g.includes("site_gratis")) A.push(["!", "O site gratuito do Google foi desativado", "Em 2024 o Google encerrou os sites gratuitos do Perfil da Empresa. O link que ainda aparece para vocês leva a uma página de erro."]);
  if (p.g.includes("site_antigo")) A.push(["!", "O site está desatualizado", `Na verificação de ${host(p.w)}: ${p.wy}. A maioria das pessoas pesquisa pelo celular, e um site assim passa a impressão de empresa parada.`]);
  if (p.g.includes("so_link")) A.push(["!", "Só um link na bio", "A presença online depende de um agregador de links, sem uma página própria para aparecer no Google."]);
  if (p.g.includes("sem_site")) A.push(["!", "Não encontramos um site", `Nos cadastros públicos que consultamos não aparece um site de vocês. Quem pesquisa ${tipo || "o serviço"} em ${b} encontra primeiro quem tem.`]);
  if (p.g.includes("sem_agenda")) A.push(["!", "Agendamento só por mensagem", "Não encontramos agenda online. Cada horário depende de troca de mensagens, e quem quer marcar fora do horário comercial desiste ou marca em outro lugar."]);
  if (p.g.includes("sem_ig") && !p.o) A.push(["i", "Instagram não aparece nos cadastros", "Se vocês já têm um perfil, vale ligá-lo ao Google e ao site, para quem pesquisa ver o trabalho antes de entrar em contato."]);
  return A;
}
function solucoes(p) {
  const S = [];
  if (p.g.some(g => ["site_fora", "site_gratis", "site_antigo", "so_link", "sem_site"].includes(g))) S.push(p.s === "b2b" ? ["Site e catálogo digital", "Site institucional com as linhas de produto e um catálogo que o comprador usa sem ligar."] : ["Site profissional", "Rápido no celular, com serviços, fotos, localização, botão de WhatsApp e Google configurado."]);
  if (p.g.includes("sem_agenda")) S.push(["Agenda online", "A cliente marca sozinha e paga o sinal por Pix. Confirmação e lembrete no WhatsApp."]);
  if (p.s !== "b2b") S.push(["Instagram com direção de arte", "Padrão visual, artes e legendas para o perfil mostrar a qualidade do trabalho."]);
  return S;
}
async function vDiag(id) {
  const V = document.getElementById("vista");
  V.innerHTML = `<div class="gut"><div class="in carregando">Carregando o diagnóstico…</div></div>`;
  let p = null;
  try { const r = await fetch("d/" + id.slice(-2).toLowerCase() + ".json"); if (r.ok) p = (await r.json())[id]; } catch {}
  if (location.hash.slice(1) !== id) return;
  if (!p) { V.innerHTML = `<section class="faixa gut"><div class="in cta"><span class="rot">Diagnóstico</span><h2>Não encontramos este diagnóstico<i>.</i></h2><p class="lead">O link pode estar incompleto. Veja o que fazemos para cada segmento ou fale direto com a gente.</p><div><a class="btn pri" href="#inicio">Ver apresentação</a></div></div></section>`; return; }
  const A = achados(p), seg = SEG[p.s] || SEG.comercio, temAg = p.g.includes("sem_agenda");
  const txt = `Oi! Vi o diagnóstico que vocês fizeram do ${p.n} e quero conversar.`;
  document.title = "Diagnóstico · " + p.n;
  const cc = concDo(p.t), fotoD = cc ? `conceito/${cc[0]}/img/p1.jpg` : FOTO_SEG[p.s] || FOTO_SEG.comercio;
  V.innerHTML = `${abreFoto(fotoD, `Diagnóstico digital · ${p.t} · ${p.d}`, esc(p.n), `Olhamos como o ${esc(p.n)} aparece para quem procura ${esc((p.t || "o serviço").toLowerCase())} em ${esc(p.d)}. Encontramos ${A.length === 1 ? "um ponto" : A.length + " pontos"} que fazem clientes desistirem antes de entrar em contato.`,
      `<a class="btn claro" href="${esc(wa(txt))}" target="_blank" rel="noopener">Conversar sobre o diagnóstico</a>`)}
    <section class="faixa areia gut"><div class="in"><div class="cab-sec"><span class="rot">O que encontramos</span><h2>${A.length ? "Pontos de atenção" : "Presença em ordem"}<i>.</i></h2></div>
      <div class="achados">${A.map(a => `<div class="achado${a[0] === "i" ? " leve" : ""}"><span class="ico" aria-hidden="true">${a[0]}</span><div><h3>${esc(a[1])}</h3><p>${esc(a[2])}</p></div></div>`).join("")}</div>
      <p class="nota" style="margin-top:14px">Verificação feita com dados públicos em ${VERIF}. Se algo já mudou, ótimo: é só nos avisar.</p></div></section>
    ${temAg ? `<section class="faixa gut"><div class="in agenda-box"><div class="cab-sec" style="margin:0"><span class="rot">Como ficaria</span><h2>A agenda do ${esc(p.n)}, aberta 24 horas<i>.</i></h2>
      <p class="lead">Um exemplo com o nome de vocês: a cliente escolhe o serviço, o dia e o horário, paga o sinal por Pix e recebe a confirmação no WhatsApp.</p>
      <div><a class="btn sec" href="agenda/" target="_blank" rel="noopener">Testar a demonstração completa</a></div></div>${agenda(p.n, p.t)}</div></section>` : ""}
    ${(() => { const c = concDo(p.t); return c ? `<section class="faixa gut ${temAg ? "" : "areia"}"><div class="in agenda-box"><div class="cab-sec" style="margin:0"><span class="rot">Como poderia ficar</span><h2>Um site pensado para ${esc((p.t || "o seu negócio").toLowerCase())}<i>.</i></h2>
      <p class="lead">Criamos o ${esc(c[1])}, uma empresa fictícia do mesmo ramo, para mostrar como funcionaria: ${esc(c[4].toLowerCase())}. O do ${esc(p.n)} seria feito com a marca, as fotos e os serviços de vocês.</p>
      <div><a class="btn pri" href="conceito/${c[0]}/" target="_blank" rel="noopener">Abrir o exemplo</a></div></div><a href="conceito/${c[0]}/" target="_blank" rel="noopener" class="conc-img"><img src="conceito/${c[0]}/img/p1.jpg" alt="Página inicial do site de exemplo ${esc(c[1])}"></a></div></section>` : ""; })()}
    <section class="faixa gut ${temAg ? "areia" : ""}"><div class="in"><div class="cab-sec"><span class="rot">O que faríamos</span><h2>Para resolver, nesta ordem<i>.</i></h2></div>
      <div class="solucoes">${solucoes(p).map(s => `<div class="sol"><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join("")}</div></div></section>
    ${secCases(seg.cases, "Trabalhos parecidos que já fizemos")}${secCTA("Quer resolver isso", txt)}`;
}
let vistaAtual = "";
function rota() {
  const h = location.hash.slice(1);
  document.querySelectorAll(".nav a").forEach(a => a.setAttribute("aria-current", a.dataset.v === h ? "page" : "false"));
  const V = document.getElementById("vista");
  if (ANCORAS.includes(h) || /^exemplos-/.test(h)) {
    if (/^exemplos-/.test(h)) { const k = h.slice(9); if (vistaAtual !== k && SEG[k]) { V.innerHTML = vSeg(k); vistaAtual = k; } }
    else if (vistaAtual !== "inicio") { V.innerHTML = vInicio(); vistaAtual = "inicio"; document.title = "Eikóna · Marketing e Comunicação"; }
    requestAnimationFrame(() => document.getElementById(h)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }));
    return;
  }
  document.title = "Eikóna · Marketing e Comunicação";
  if (SEG[h]) { V.innerHTML = vSeg(h); vistaAtual = h; }
  else if (/^[FO][A-Za-z0-9]{3,24}$/.test(h)) { vistaAtual = h; vDiag(h); }
  else { V.innerHTML = vInicio(); vistaAtual = "inicio"; }
  V.classList.remove("vista"); void V.offsetWidth; V.classList.add("vista");
  window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const f = e.target.closest(".filtro button");
  if (f) { f.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === f))); document.querySelectorAll(".concs .conc").forEach(c => c.hidden = !!f.dataset.f && c.dataset.seg !== f.dataset.f); }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "formDiag") return; e.preventDefault();
  const v = id => document.getElementById(id).value.trim(), emp = v("dEmp");
  if (!emp) { document.getElementById("dEmp").focus(); return; }
  const t = `Oi! Quero o diagnóstico grátis da Eikóna.\nEmpresa: ${emp}${v("dLink") ? `\nInstagram ou site: ${v("dLink")}` : ""}\nSegmento: ${v("dSeg")}${v("dBairro") ? `\nBairro: ${v("dBairro")}` : ""}`;
  window.open(wa(t), "_blank", "noopener");
});
addEventListener("hashchange", rota);
rota();
})();
</script>

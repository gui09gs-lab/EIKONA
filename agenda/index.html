<!doctype html><html lang="pt-BR"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Agenda Online Sua Marca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Oswald:wght@500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna (até 820px). Faixa de demonstração no topo; cabeçalho com a marca e faixa tracejada; página da cliente em 3 passos; painel com abas */
:root{
  --bg:#121315; --surface:#1B1D20; --surface2:#24272B; --line:#33373D; --ink:#F1EEE8; --muted:#A7A29B;
  --ok:#5CC98E; --ok-bg:#163126; --warn:#E8AC5A; --warn-bg:#382912; --bad:#F08C95; --bad-bg:#3C1E22;
  --wa:#1E9A5A; --on-wa:#FFFFFF; --demo:#2B2E33;
  --accent:#E3C489; --on-accent:#1B1712;
  --accent-soft:color-mix(in srgb, var(--accent) 16%, var(--surface));
  --accent-line:color-mix(in srgb, var(--accent) 45%, var(--line));
  --f-marca:"Fraunces",Georgia,serif;
  --f-display:"Oswald","Arial Narrow",system-ui,sans-serif;
  --f-body:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px; --qr-bg:#FFFFFF; --qr-ink:#1B1712;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F4F2EE; --surface:#FFFFFF; --surface2:#EFECE6; --line:#E0DBD2; --ink:#1E1C19; --muted:#69635B;
  --ok:#12784A; --ok-bg:#E2F2E9; --warn:#8F5100; --warn-bg:#FBEEDC; --bad:#A3333D; --bad-bg:#F9E3E5;
  --wa:#12784A; --on-wa:#FFFFFF; --demo:#E7E3DC;
  color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#F4F2EE; --surface:#FFFFFF; --surface2:#EFECE6; --line:#E0DBD2; --ink:#1E1C19; --muted:#69635B;
  --ok:#12784A; --ok-bg:#E2F2E9; --warn:#8F5100; --warn-bg:#FBEEDC; --bad:#A3333D; --bad-bg:#F9E3E5;
  --wa:#12784A; --on-wa:#FFFFFF; --demo:#E7E3DC;
  color-scheme:light;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--demo)}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* faixa de demonstração */
.demo{background:var(--demo);font-size:13px}
.demo .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;flex-wrap:wrap}
.demo .tag{color:var(--muted);font-weight:500}
.demo .tag b{color:var(--ink);font-weight:600}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:3px;gap:2px}
.seg a{padding:5px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600}
.seg a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}

/* cabeçalho da marca */
.topo{position:relative;background:
  radial-gradient(circle at 20% 30%, color-mix(in srgb,var(--accent) 22%,transparent) 0 3px, transparent 4px) 0 0/46px 46px,
  radial-gradient(circle at 70% 75%, color-mix(in srgb,var(--accent) 14%,transparent) 0 6px, transparent 7px) 0 0/46px 46px,
  linear-gradient(180deg, color-mix(in srgb,var(--accent) 14%,var(--surface)), var(--surface));}
.topo::after{content:"";display:block;height:8px;background:repeating-linear-gradient(90deg,var(--accent) 0 10px,transparent 10px 18px);opacity:.9}
.marca{display:flex;align-items:center;gap:14px}
.logo{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.logo.vazio{background:none;border:2px dashed var(--accent);color:var(--accent);font-size:9px;font-weight:700;letter-spacing:.04em;text-align:center;line-height:1.1}
.marca-nome{font-family:var(--f-marca);font-weight:800;letter-spacing:-.01em;line-height:1.05}
.marca-frase{font-family:var(--f-marca);font-style:italic;font-weight:700;color:var(--accent);opacity:.95}
.topo.grande .wrap{padding-block:30px 26px;display:grid;gap:10px}
.topo.grande .logo{width:68px;height:68px}
.topo.grande .marca-nome{font-size:clamp(30px,7vw,44px)}
.topo.grande .marca-frase{font-size:19px}
.endereco{color:var(--muted);font-size:14px;display:flex;gap:6px;align-items:center}
.topo.painel{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.topo.painel .wrap{padding-block:12px 0}
.topo.painel .marca-nome{font-size:21px}
.topo.painel .logo{width:34px;height:34px}
.topo.painel .logo.vazio{font-size:6px}
.linha-topo{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:10px 10px}
.tabs button{border:0;background:none;padding:8px 13px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--ink)}
.badge{background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:11px;min-width:20px;height:18px;display:inline-grid;place-items:center;padding:0 5px;font-weight:700}

main{padding-block:22px 90px;display:grid;gap:26px}
section{display:grid;gap:12px;min-width:0}
.passo-h{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;text-transform:uppercase;font-size:20px;letter-spacing:.03em}
.passo-h .n{width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:14px}
.passo-h.feito .n{background:var(--accent);color:var(--on-accent)}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sec-head h2{font-family:var(--f-display);font-weight:600;font-size:19px}
.hint{color:var(--muted);font-size:13px;margin:0}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:700;color:var(--muted)}

/* página da cliente */
.servs{display:grid;gap:8px}
.serv{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;cursor:pointer;width:100%}
.serv:hover{border-color:var(--accent-line)}
.serv[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.serv strong{display:block;font-weight:600}
.serv .sub{color:var(--muted);font-size:13px}
.serv .preco{font-weight:700;white-space:nowrap}
.dias{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.dia{flex:none;width:68px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 4px;display:grid;justify-items:center;gap:1px;cursor:pointer}
.dia .d3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.dia .dn{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.1}
.dia .mm{font-size:11px;color:var(--muted)}
.dia .vg{font-size:11px;font-weight:700;color:var(--ok)}
.dia .vg.zero{color:var(--muted);font-weight:500}
.dia[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.dia[aria-pressed="true"] *{color:var(--on-accent)}
.dia:disabled{opacity:.45;cursor:default}
.turno{display:grid;gap:6px}
.horas{display:flex;flex-wrap:wrap;gap:8px}
.hora{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.hora:hover{border-color:var(--accent-line)}
.hora[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.resumo{background:var(--surface);border:1px solid var(--accent-line);border-radius:var(--r);padding:16px;display:grid;gap:14px}
.resumo .linha{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* componentes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--on-wa)}
.btn.wa.soft{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.btn.ghost{background:none;border-color:transparent;padding-inline:8px}
.btn.danger{color:var(--bad);border-color:transparent;background:var(--bad-bg)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.big{padding:12px 20px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
:is(.btn,.tabs button,.serv,.dia,.hora,.chip,.seg a,.periodo button,.diasem):focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:grid}
.row-main strong{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--muted);font-size:13px}
.time{font-family:var(--f-display);font-weight:600;font-size:18px;min-width:52px}
.pill{display:inline-flex;align-items:center;border-radius:999px;font-size:12px;font-weight:600;padding:2px 9px;background:var(--accent-soft);color:var(--ink)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.mute{background:var(--surface2);color:var(--muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:18px;margin-bottom:4px}
.notice{border-radius:12px;padding:12px 14px;background:var(--warn-bg);color:var(--warn);font-size:14px}

/* números */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;align-content:start;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.15}
.stat span{font-size:14px}
.stat small{color:var(--muted);font-size:12.5px;line-height:1.35}

/* agenda */
.weeknav{display:flex;align-items:center;gap:8px;justify-content:space-between}
.weeknav h2{font-family:var(--f-display);font-weight:600;font-size:19px}
.semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.diasem{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 2px;display:grid;justify-items:center;gap:2px;cursor:pointer;min-width:0}
.diasem .d3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.diasem .dn{font-family:var(--f-display);font-weight:600;font-size:19px}
.diasem .dc{font-size:11px;color:var(--muted);height:15px}
.diasem[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.diasem[aria-pressed="true"] *{color:var(--on-accent)}
.diasem.hoje .dn{text-decoration:underline;text-underline-offset:3px}
.diasem.fechado{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--accent-line);background:none;border-radius:999px;padding:5px 11px;font-weight:600;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip:hover{background:var(--accent-soft)}
.cards{display:grid;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 14px;padding:13px 15px}
.card.st-cancelado,.card.st-faltou{opacity:.7}
.card.bloqueio{background:repeating-linear-gradient(-45deg,var(--surface) 0 9px,var(--surface2) 9px 18px)}
.card .t{display:grid;align-content:start}
.card .t b{font-family:var(--f-display);font-weight:600;font-size:19px}
.card .t span{font-size:12px;color:var(--muted)}
.card .body{min-width:0;cursor:pointer;background:none;border:0;text-align:left;padding:0}
.card .body strong{font-weight:600}
.more{grid-column:1/-1;display:grid;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp .lbl{width:100%;font-size:12px;color:var(--muted);font-weight:600}
.sent{font-size:12px;color:var(--ok);font-weight:600}

/* relatórios */
.periodo{display:flex;gap:6px;flex-wrap:wrap}
.periodo button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;cursor:pointer}
.periodo button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.barras{display:grid;gap:10px}
.barra{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:14px}
.barra .trilho{grid-column:1/-1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.barra .trilho i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* formulários */
form{display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:600;font-size:19px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-weight:400;font-size:15px;width:100%;min-width:0;color:var(--ink)}
input[type="color"]{padding:3px;height:42px;cursor:pointer}
textarea{resize:vertical;min-height:92px;line-height:1.4}
.check{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--ink);font-size:14px}
.check input{width:auto}
.fechados{display:flex;flex-wrap:wrap;gap:6px}
.fechados label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--ink);font-weight:500;cursor:pointer}
.fechados input{width:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.svc-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 110px auto;gap:8px;align-items:end;padding:10px 0;border-top:1px solid var(--line)}
.svc-row:first-child{border-top:0;padding-top:0}
@media (max-width:540px){.svc-row{grid-template-columns:1fr 1fr}.svc-row label:first-child{grid-column:1/-1}}
.preview{background:var(--ok-bg);color:var(--ink);border-radius:12px 12px 12px 3px;padding:10px 12px;font-size:14px;white-space:pre-wrap;max-width:460px}
.vars{display:flex;flex-wrap:wrap;gap:4px}
.vars button{border:1px solid var(--line);background:var(--bg);border-radius:6px;font-size:12px;padding:2px 7px;cursor:pointer;font-family:ui-monospace,Consolas,monospace}
.copybox{min-height:150px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
.card.st-expirado{opacity:.7}
.pix{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:560px){.pix{grid-template-columns:1fr;justify-items:center}.pix>div:last-child{width:100%}}
.qr{position:relative;background:var(--qr-bg);padding:10px;border-radius:12px;width:200px;height:200px}
.qr #qr-in canvas,.qr #qr-in img{display:block;width:180px;height:180px}
.qr.exemplo #qr-in{filter:blur(3px);opacity:.45}
.qr-aviso{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:700;color:var(--qr-ink);font-size:14px;padding:22px;line-height:1.3}
.copia{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-height:76px;overflow:auto;user-select:all}
.contador{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.1}
.valor-sinal{font-family:var(--f-display);font-size:22px;font-weight:600}
@media (max-width:540px){.row.hj{flex-wrap:wrap}.row.hj>.actions{width:100%;padding-left:64px}}
@media (max-width:480px){.semana{gap:4px}.diasem .dc{font-size:10px}}
</style>

<div class="demo"><div class="wrap">
  <span class="tag"><b>Demonstração</b> · troque marca, serviços e horários em Ajustes</span>
  <nav class="seg" aria-label="Escolher tela"><a href="#agendar" id="nav-agendar">Página da cliente</a><a href="#painel" id="nav-painel">Painel</a></nav>
</div></div>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ds(d); };
const diffDays = (a,b) => Math.round((parse(b) - parse(a)) / 864e5);
const today = () => ds(new Date());
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const toMin = h => { if (!h) return 0; const [a,b] = h.split(':').map(Number); return a*60 + (b||0); };
const toHM = m => pad(Math.floor(m/60)) + ':' + pad(m%60);
const DOW = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const DOW3 = ['dom','seg','ter','qua','qui','sex','sáb'];
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const fmtData = s => { const d = parse(s); return pad(d.getDate()) + '/' + pad(d.getMonth()+1); };
const diaCurto = s => { const t = today(); if (s === t) return 'hoje'; if (s === addDays(t,1)) return 'amanhã'; return DOW3[parse(s).getDay()] + ' ' + fmtData(s); };
const money = v => (v == null || v === '' || isNaN(v)) ? '' : 'R$ ' + Number(v).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const parseMoney = s => { s = String(s ?? '').replace(/[^\d,.]/g,''); if (!s) return null; if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); const n = parseFloat(s); return isNaN(n) ? null : n; };
const digits = t => String(t ?? '').replace(/\D/g,'');
const normTel = t => { const d = digits(t); if (d.startsWith('55') && (d.length === 12 || d.length === 13)) return d; if (d.length === 10 || d.length === 11) return '55' + d; return ''; };

function wireForm() {
  const g = id => document.getElementById(id);
  if (!g('f-ag')) return;
  const check = () => {
    const data = g('ag-data').value, hora = g('ag-hora').value, dur = Number(g('ag-dur').value) || 0, msgs = [];
    if (data && hora) {
      const c = conflitos(data, hora, dur, S.form.id);
      if (c.length) msgs.push(`Choca com ${c.map(a => `${isBloq(a) ? 'um bloqueio' : esc(a.cliente)} (${esc(a.hora)})`).join(', ')}.`);
      if (fechado(data)) msgs.push('Este dia está marcado como fechado.');
      if (toMin(hora) < toMin(D.cfg.abre) || toMin(hora) + dur > toMin(D.cfg.fecha)) msgs.push(`Fora do horário de atendimento (${esc(D.cfg.abre)} às ${esc(D.cfg.fecha)}).`);
      if (data < today()) msgs.push('Esta data já passou.');
    }
    g('ag-warn').innerHTML = msgs.length ? `<div class="notice">${msgs.join(' ')} Dá para salvar mesmo assim.</div>` : '';
  };
  g('ag-bloq').addEventListener('change', e => { g('ag-cli-box').hidden = e.target.checked; g('ag-svc-box').hidden = e.target.checked; });
  g('ag-servico').addEventListener('change', e => { const s = D.servicos.find(x => x.nome === e.target.value); if (s) { g('ag-dur').value = s.dur; g('ag-valor').value = s.valor == null ? '' : String(s.valor).replace('.', ','); } check(); });
  g('ag-cliente').addEventListener('change', e => { const c = clientes().find(x => x.nome.toLowerCase() === e.target.value.trim().toLowerCase()); if (c && !g('ag-tel').value) g('ag-tel').value = fmtTel(c.tel); });
  g('ag-tel').addEventListener('blur', e => { e.target.value = fmtTel(e.target.value); });
  ['ag-data','ag-hora','ag-dur'].forEach(id => g(id).addEventListener('input', check));
  g('f-ag').addEventListener('submit', e => {
    e.preventDefault();
    const bloq = g('ag-bloq').checked;
    const doc = { cliente: bloq ? '' : g('ag-cliente').value.trim(), tel: bloq ? '' : fmtTel(g('ag-tel').value), servico: bloq ? '' : g('ag-servico').value,
      data: g('ag-data').value, hora: g('ag-hora').value, dur: Number(g('ag-dur').value) || 0, valor: bloq ? null : parseMoney(g('ag-valor').value),
      obs: g('ag-obs').value.trim(), tipo: bloq ? 'bloqueio' : 'atendimento' };
    const falta = [];
    if (!bloq && !doc.cliente) falta.push('o nome da cliente');
    if (!doc.data) falta.push('o dia'); if (!doc.hora) falta.push('a hora'); if (!doc.dur) falta.push('a duração');
    if (falta.length) { g('ag-warn').innerHTML = `<div class="notice">Falta preencher ${falta.join(', ')}.</div>`; return; }
    if (!bloq && doc.tel && !normTel(doc.tel)) { g('ag-warn').innerHTML = `<div class="notice">O WhatsApp precisa ter DDD e número, por exemplo (11) 98765-4321.</div>`; return; }
    if (S.form.id) {
      const old = getAg(S.form.id) || {};
      const patch = { ...doc };
      if (old.data !== doc.data || old.hora !== doc.hora) { patch.enviados = {}; patch.confirmou = false; }
      upd(S.form.id, patch); toast('Horário atualizado');
    } else {
      D.ags.push({ ...doc, id: uid(), status: 'agendado', origem: 'painel', confirmou: false, enviados: {}, criado: new Date().toISOString() }); save();
      toast(bloq ? 'Horário bloqueado' : 'Horário salvo. A confirmação ficou na aba Hoje.');
    }
    S.dia = doc.data; S.form = null; render();
  });
  check();
}

const PERIODOS = [['mes','Este mês'],['passado','Mês passado'],['30','30 dias'],['90','90 dias'],['ano','Este ano'],['prox','Próximos 30 dias'],['tudo','Tudo']];
function intervalo(p) {
  const h = today(), d = parse(h), y = d.getFullYear(), m = d.getMonth();
  const fimMes = (yy, mm) => ds(new Date(yy, mm + 1, 0));
  switch (p) {
    case 'mes': return [ds(new Date(y, m, 1)), fimMes(y, m)];
    case 'passado': return [ds(new Date(y, m - 1, 1)), fimMes(y, m - 1)];
    case '30': return [addDays(h, -29), h];
    case '90': return [addDays(h, -89), h];
    case 'ano': return [`${y}-01-01`, `${y}-12-31`];
    case 'prox': return [h, addDays(h, 29)];
    default: return ['0000-01-01', '9999-12-31'];
  }
}
function viewRelatorios() {
  const [a0, a1] = intervalo(S.periodo);
  const real = D.ags.filter(a => !isBloq(a));
  const no = real.filter(a => a.data >= a0 && a.data <= a1);
  const conc = no.filter(a => a.status === 'concluido'), aberto = no.filter(a => a.status === 'agendado');
  const falt = no.filter(a => a.status === 'faltou'), canc = no.filter(a => a.status === 'cancelado');
  const fat = conc.reduce((s,a) => s + (Number(a.valor) || 0), 0), prev = aberto.reduce((s,a) => s + (Number(a.valor) || 0), 0);
  const deviam = conc.length + falt.length;
  const atendidas = new Set(conc.map(a => digits(a.tel) || a.cliente.toLowerCase()));
  const primeiras = new Map(); real.filter(a => a.status === 'concluido').sort((x,y) => x.data.localeCompare(y.data)).forEach(a => { const k = digits(a.tel) || a.cliente.toLowerCase(); if (!primeiras.has(k)) primeiras.set(k, a.data); });
  const novas = [...atendidas].filter(k => { const p = primeiras.get(k); return p >= a0 && p <= a1; }).length;
  const validos = no.filter(a => a.status !== 'cancelado'), pelolink = validos.filter(a => a.origem === 'link').length;
  const pagos = no.filter(a => a.sinalPago), somaSinal = pagos.reduce((s,a) => s + (Number(a.sinal) || 0), 0);
  const aguard = no.filter(a => a.status === 'aguardando').length, expir = no.filter(a => a.status === 'expirado').length;
  const feitos = real.filter(a => a.criado && a.criado.slice(0,10) >= a0 && a.criado.slice(0,10) <= a1).length;
  const porSvc = {}; no.filter(a => a.status !== 'cancelado').forEach(a => { porSvc[a.servico] = (porSvc[a.servico] || 0) + 1; });
  const top = Object.entries(porSvc).sort((x,y) => y[1] - x[1]), max = top.length ? top[0][1] : 1;
  const st = (n, l, s) => `<div class="stat"><b class="num">${n}</b><span>${l}</span>${s ? `<small>${s}</small>` : ''}</div>`;
  const pct = (a,b) => b ? Math.round(a / b * 100) + '%' : '0%';
  const lbl = PERIODOS.find(p => p[0] === S.periodo)[1];
  return `<section>
    <div class="sec-head"><h2>Relatórios</h2></div>
    <div class="periodo">${PERIODOS.map(([k,l]) => `<button aria-pressed="${S.periodo === k}" data-a="periodo" data-v="${k}">${l}</button>`).join('')}</div>
    <p class="hint">${lbl}${S.periodo === 'tudo' ? '' : ': ' + fmtData(a0) + ' a ' + fmtData(a1)}. Contado pela data do atendimento.</p>
    <div class="stats">
      ${st(no.length, 'horários no período', `${conc.length} concluídos · ${aberto.length} em aberto`)}
      ${st(money(fat) || 'R$ 0,00', 'faturamento', 'só atendimentos concluídos')}
      ${st(conc.length ? money(fat / conc.length) : '–', 'ticket médio')}
      ${st(money(prev) || 'R$ 0,00', 'previsto em aberto', `${aberto.length} horários ainda não atendidos`)}
      ${st(falt.length, 'faltas', `${pct(falt.length, deviam)} de quem devia vir`)}
      ${st(canc.length, 'cancelamentos')}
      ${st(atendidas.size, 'clientes atendidas', `${novas} ${novas === 1 ? 'nova' : 'novas'} no período`)}
      ${st(pct(pelolink, validos.length), 'agendados pelo link', `${pelolink} de ${validos.length}`)}
      ${st(feitos, 'agendamentos feitos no período', 'pela data em que foram marcados')}
      ${st(money(somaSinal) || 'R$ 0,00', 'sinais recebidos por Pix', `${pagos.length} pagos · ${aguard} aguardando · ${expir} não pagos`)}
    </div>
  </section>
  <section class="panel"><h2>Serviços mais marcados</h2>
    ${top.length ? `<div class="barras">${top.map(([n,q]) => `<div class="barra"><span>${esc(n)}</span><b class="num">${q}</b><div class="trilho"><i style="width:${Math.max(4, q / max * 100)}%"></i></div></div>`).join('')}</div>`
      : `<p class="hint">Nenhum horário neste período.</p>`}
  </section>`;
}

/* ---------- copiar horários livres ---------- */
function textoLivres() {
  const h = today(), linhas = [];
  for (let i = 0; i < 7; i++) { const d = addDays(h, i), l = livres(d); if (l.length) linhas.push(`${DOW3[parse(d).getDay()]} ${fmtData(d)}: ${l.join(' · ')}`); }
  return linhas.length ? `Horários livres · ${D.cfg.marca}\n\n${linhas.join('\n')}\n\nMe chama aqui para reservar o seu.` : '';
}

document.addEventListener('submit', e => {

  if (id === 'f-cli') {
    e.preventDefault();
    const nome = g('c-nome').value.trim(), tel = g('c-tel').value;

    if (!normTel(tel)) { g('c-warn').innerHTML = '<div class="notice">Coloque seu WhatsApp com DDD, por exemplo (11) 98765-4321.</div>'; return; }
    const s = D.servicos.find(x => x.id === S.c.svc);
    if (!s || conflitos(S.c.dia, S.c.hora, s.dur).length) { S.c.hora = null; render(); toast('Esse horário acabou de ser ocupado. Escolha outro.'); return; }
    const sinal = valorSinal(s);
    const a = { id: uid(), tipo: 'atendimento', cliente: nome, tel: fmtTel(tel), servico: s.nome, dur: s.dur, valor: s.valor, data: S.c.dia, hora: S.c.hora,
      status: sinal ? 'aguardando' : 'agendado', sinal: sinal || null, sinalPago: null,
      expira: sinal ? new Date(Date.now() + Math.max(5, Number(D.cfg.prazoMin) || 30) * 6e4).toISOString() : null,
      origem: 'link', confirmou: false, enviados: {}, obs: '', criado: new Date().toISOString() };

  }
  if (id === 'f-marca') {
    e.preventDefault();
    const fin = logo => { Object.assign(D.cfg, { marca: g('m-marca').value.trim() || 'Coloque sua marca', frase: g('m-frase').value.trim(), endereco: g('m-end').value.trim(), whats: fmtTel(g('m-whats').value), cor: g('m-cor').value }, logo != null ? { logo } : {}); save(); render(); toast('Marca salva'); };
    const file = g('m-logo').files[0];
    if (!file) return fin(null);
    const img = new Image(), rd = new FileReader();
    rd.onload = () => { img.onload = () => { const cv = document.createElement('canvas'), z = 160, m = Math.min(img.width, img.height); cv.width = cv.height = z;
      cv.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, z, z); fin(cv.toDataURL('image/png')); };
      img.onerror = () => toast('Não consegui abrir essa imagem. Tente um PNG ou JPG.'); img.src = rd.result; };
    rd.readAsDataURL(file);

  if (id === 'f-pix') {

    if (tipo === 'pct' && val > 100) return toast('A porcentagem vai até 100%.');
    Object.assign(D.cfg, { pixAtivo: g('x-on').checked, pixTipo: g('x-tipo').value, pixChave: g('x-chave').value.trim(), pixNome: g('x-nome').value.trim(),
      pixCidade: g('x-cid').value.trim(), sinalTipo: tipo, sinalValor: val, prazoMin: Math.max(5, Number(g('x-prazo').value) || 30), politica: g('x-pol').value.trim() });
    if (D.cfg.pixAtivo && D.cfg.pixChave && !chavePix()) return toast('Confira a chave Pix: o celular precisa ter DDD e número.');
    save(); render(); toast('Sinal salvo');
  }
  if (id === 'f-hor') {
    e.preventDefault();
    const abre = g('h-abre').value || '09:00', fecha = g('h-fecha').value || '18:00';
    if (toMin(fecha) <= toMin(abre)) return toast('O horário de fechar precisa ser depois do de abrir.');
    Object.assign(D.cfg, { abre, fecha, passo: Math.max(5, Number(g('h-passo').value) || 30), fechados: [0,1,2,3,4,5,6].filter(d => g('h-f' + d).checked) });
    save(); render(); toast('Horário salvo');
  }
  if (id === 'f-svc') {
    e.preventDefault();
    const nome = g('s-nome').value.trim(); if (!nome) return toast('Escreva o nome do serviço.');
    D.servicos.push({ id: uid(), nome, dur: Math.max(5, Number(g('s-dur').value) || 60), valor: parseMoney(g('s-valor').value) }); save(); render(); toast('Serviço adicionado');
  }
  if (id === 'f-msg') {
    e.preventDefault();
    Object.entries(KINDS).forEach(([k,o]) => { D.cfg[o.key] = g('t-' + k).value; }); save(); toast('Mensagens salvas');
  }
});
document.addEventListener('click', async e => {

    case 'novo-cli': abrirForm({ data: today(), cliente: v, tel: el.dataset.t || '' }); break;
    case 'form-sair': S.form = null; render(); break;
    case 'open': S.open = S.open === id ? null : id; S.confirmDel = null; render(); break;
    case 'edit': { const x = getAg(id); if (!x) return; S.dia = x.data;
      abrirForm({ id, cliente: x.cliente || '', tel: x.tel || '', servico: x.servico || '', data: x.data, hora: x.hora, dur: x.dur, valor: x.valor == null ? '' : x.valor, obs: x.obs || '', bloqueio: isBloq(x) }); break; }
    case 'st': upd(id, { status: v }); toast({ concluido: 'Marcado como concluído', faltou: 'Marcado como falta', cancelado: 'Horário cancelado', agendado: 'Horário reaberto' }[v]); render(); break;
    case 'unsend': { const x = getAg(id); if (x) { x.enviados = { ...(x.enviados || {}), [el.dataset.k]: null }; save(); } toast('Voltou para a lista da aba Hoje'); render(); break; }

    case 'del-no': S.confirmDel = null; render(); break;
    case 'del-yes': D.ags = D.ags.filter(x => x.id !== id); save(); S.confirmDel = null; S.open = null; toast('Horário excluído'); render(); break;
    case 'svc-del': D.servicos = D.servicos.filter(s => s.id !== id); save(); toast('Serviço removido'); render(); break;

    case 'logo-off': D.cfg.logo = ''; save(); render(); toast('Logo removida'); break;
    case 'ins': if (lastTA) { const s = lastTA.selectionStart, t = lastTA.value; lastTA.value = t.slice(0, s) + v + t.slice(lastTA.selectionEnd); lastTA.focus(); lastTA.selectionStart = lastTA.selectionEnd = s + v.length; updPreviews(); } else toast('Toque primeiro no texto onde quer inserir.'); break;
    case 'msg-reset': Object.entries(KINDS).forEach(([k,o]) => { $('#t-' + k).value = MSG[o.key]; }); updPreviews(); toast('Textos sugeridos de volta. Toque em Salvar para manter.'); break;
    case 'reset': S.reset = true; render(); break;
    case 'reset-no': S.reset = false; render(); break;
    case 'reset-yes': D = seed(); save(); S.reset = false; S.c = { svc: null, dia: null, hora: null, feito: null }; render(); toast('Exemplo restaurado'); break;
    case 'copy-free': {
      const txt = textoLivres(); if (!txt) { toast('Não há horários livres nos próximos 7 dias.'); break; }
      let ok = false; try { await navigator.clipboard.writeText(txt); ok = true; } catch {}
      S.copyText = ok ? '' : txt; render();
      if (ok) toast('Horários copiados. É só colar no WhatsApp.'); else { const b = $('#copybox'); if (b) { b.focus(); b.select(); } toast('Selecionei o texto: copie e cole no WhatsApp.'); }
      break; }
  }
});

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2600); }

  if (expira() && !foco) { render(); return; }
  document.querySelectorAll('[data-exp]').forEach(el => { el.textContent = fmtLeft(minsLeft({ expira: el.dataset.exp })); });
}, 15000);
